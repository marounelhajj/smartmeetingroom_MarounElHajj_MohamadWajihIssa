version: "3.8"

services:
  users-service:
    build:
      context: ./users-service
      dockerfile: Dockerfile
    container_name: users-service
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=sqlite:///users.db
      - SECRET_KEY=change-this-secret-key-in-production
    volumes:
      - ./users-service:/app
      - users-data:/app/instance
    networks:
      - meeting-room-network
    restart: unless-stopped

  rooms-service:
    build:
      context: ./rooms-service
      dockerfile: Dockerfile
    container_name: rooms-service
    ports:
      - "5002:5002"
    environment:
      - DATABASE_URL=sqlite:///rooms.db
      - SECRET_KEY=change-this-secret-key-in-production
    volumes:
      - ./rooms-service:/app
      - rooms-data:/app/instance
    networks:
      - meeting-room-network
    restart: unless-stopped

  bookings-service:
    build:
      context: ./bookings-service
      dockerfile: Dockerfile
    container_name: bookings-service
    ports:
      - "5003:5003"
    environment:
      - DATABASE_URL=sqlite:///bookings.db
      - SECRET_KEY=change-this-secret-key-in-production
    volumes:
      - ./bookings-service:/app
      - bookings-data:/app/instance
    networks:
      - meeting-room-network
    restart: unless-stopped

  reviews-service:
    build:
      context: ./reviews-service
      dockerfile: Dockerfile
    container_name: reviews-service
    ports:
      - "5004:5004"
    environment:
      - DATABASE_URL=sqlite:///reviews.db
      - SECRET_KEY=change-this-secret-key-in-production
    volumes:
      - ./reviews-service:/app
      - reviews-data:/app/instance
    networks:
      - meeting-room-network
    restart: unless-stopped

  load-balancer:
    image: nginx:1.25-alpine
    container_name: meetingroom-lb
    volumes:
      - ./load-balancer/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - bookings-service
      - reviews-service
    ports:
      - "8080:8080"
    networks:
      - meeting-room-network
    restart: unless-stopped

volumes:
  users-data:
  rooms-data:
  bookings-data:
  reviews-data:

networks:
  meeting-room-network:
    driver: bridge
